name: Fetch WK Results

on:
  schedule:
    # Elke 3 uur tijdens het WK (wedstrijden op verschillende tijdstippen)
    - cron: '0 1,4,7,16,19,22 * * *'
  workflow_dispatch: # Handmatig triggeren via GitHub

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch results from Football-Data API
        run: |
          echo "=== WK Pool 2026 - Uitslagen ophalen ==="

          MATCHES=$(curl -s -H "X-Auth-Token: ${{ secrets.FOOTBALL_API_KEY }}" \
            "https://api.football-data.org/v4/competitions/WC/matches?status=FINISHED")

          COUNT=$(echo "$MATCHES" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['resultSet']['count'])" 2>/dev/null || echo "0")
          echo "Afgelopen wedstrijden: $COUNT"

          if [ "$COUNT" = "0" ]; then
            echo "Geen uitslagen beschikbaar."
            exit 0
          fi

          RESULTS=$(echo "$MATCHES" | python3 -c "
          import sys, json

          data = json.load(sys.stdin)
          groups = {
              'A':['Mexico','South Africa','South Korea','Czechia'],
              'B':['Canada','Bosnia and Herzegovina','Qatar','Switzerland'],
              'C':['Brazil','Haiti','Morocco','Scotland'],
              'D':['USA','Australia','Paraguay','Turkiye'],
              'E':['Germany','Ecuador','Curacao','Ivory Coast'],
              'F':['Japan','Netherlands','Sweden','Tunisia'],
              'G':['Belgium','Egypt','Iran','New Zealand'],
              'H':['Spain','Uruguay','Saudi Arabia','Cape Verde'],
              'I':['France','Senegal','Norway','Iraq'],
              'J':['Argentina','Algeria','Austria','Jordan'],
              'K':['Portugal','Colombia','DR Congo','Uzbekistan'],
              'L':['England','Croatia','Ghana','Panama']
          }

          name_map = {
              'Korea Republic':'South Korea','Republic of Korea':'South Korea',
              'Türkiye':'Turkiye','Turkey':'Turkiye',
              \"Côte d'Ivoire\":'Ivory Coast',
              'Bosnia-Herzegovina':'Bosnia and Herzegovina',
              'United States':'USA','United States of America':'USA',
              'Cabo Verde':'Cape Verde','Cape Verde Islands':'Cape Verde',
              'Congo DR':'DR Congo','Democratic Republic of Congo':'DR Congo',
              'Curaçao':'Curacao','IR Iran':'Iran',
              'Czech Republic':'Czechia'
          }

          all_teams = [t for teams in groups.values() for t in teams]

          def map_name(n):
              if n in name_map: return name_map[n]
              if n in all_teams: return n
              for t in all_teams:
                  if t.lower() == n.lower(): return t
              return n

          def get_matches(teams):
              m = []
              for i in range(len(teams)):
                  for j in range(i+1, len(teams)):
                      m.append((teams[i], teams[j]))
              return m

          results = {}
          for match in data.get('matches', []):
              home = map_name(match['homeTeam'].get('name','') or match['homeTeam'].get('shortName',''))
              away = map_name(match['awayTeam'].get('name','') or match['awayTeam'].get('shortName',''))
              hs = match['score']['fullTime']['home']
              aws = match['score']['fullTime']['away']
              if hs is None or aws is None: continue
              for letter, teams in groups.items():
                  for i, (mh, ma) in enumerate(get_matches(teams)):
                      if mh == home and ma == away:
                          results[f'{letter}_{i}'] = f'{hs}-{aws}'
                      elif mh == away and ma == home:
                          results[f'{letter}_{i}'] = f'{aws}-{hs}'

          print(json.dumps(results))
          ")

          echo "Resultaten: $RESULTS"

          # Write to Firebase
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            "${{ secrets.FIREBASE_DB_URL }}/pools/${{ secrets.POOL_CODE }}/results.json" \
            -d "$RESULTS" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "Firebase response: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Uitslagen opgeslagen!"
          else
            echo "Firebase write mislukt (code $HTTP_CODE)"
            echo "$RESPONSE"
            exit 1
          fi
